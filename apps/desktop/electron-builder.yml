appId: com.goodstuff.dsgamemaker
productName: Good Stuff DS Game Maker
directories:
  buildResources: build
  output: release
files:
  - out/**/*
asarUnpack:
  - resources/**
extraResources:
  # The C runtime "Export ROM..." builds ROMs from (see src/main/export-rom-ipc.ts).
  - from: ../../packages/compiler/runtime
    to: compiler-runtime
